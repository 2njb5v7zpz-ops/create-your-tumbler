<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone写真表示テスト</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:20px;background:#f5f5f5}main{max-width:600px;margin:auto;background:white;padding:20px;border-radius:16px}label{display:block;padding:16px;background:#222;color:white;text-align:center;border-radius:12px;font-weight:700}input{display:none}#status{margin:14px 0;color:#555}img{display:none;width:100%;height:auto;border-radius:10px}</style></head><body><main><h2>iPhone写真表示テスト</h2><p>写真を1枚選んでください。</p><label>写真アプリから写真を選ぶ<input id="pick" type="file" accept="image/*"></label><div id="status">まだ写真は選択されていません。</div><img id="preview" alt="選択した写真"></main><script>const pick=document.getElementById('pick'),preview=document.getElementById('preview'),status=document.getElementById('status');pick.addEventListener('change',function(){const file=this.files&&this.files[0];if(!file)return;status.textContent='写真を読み込んでいます…';const reader=new FileReader();reader.onload=function(e){preview.src=e.target.result;preview.onload=function(){preview.style.display='block';status.textContent='✓ 写真を表示できました。'};preview.onerror=function(){status.textContent='✕ 写真は選択できましたが、表示できませんでした。'};};reader.onerror=function(){status.textContent='✕ ファイルを読み込めませんでした。'};reader.readAsDataURL(file);});</script></body></html>
