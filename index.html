<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>クリタンメーカー — Grande 470ml</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 18px 50px;
}

h1 {
  font-size: 30px;
  line-height: 1.25;
  margin: 0 0 18px;
}

.subtitle {
  font-size: 20px;
  color: #666;
  line-height: 1.5;
  margin-bottom: 24px;
}

/* 写真選択 */
.fileButton {
  display: block;
  width: 100%;
  background: #222;
  color: white;
  text-align: center;
  padding: 20px 10px;
  border-radius: 20px;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 30px;
}

#photoInput {
  display: none;
}

/* プレビュー外枠 */
.previewOuter {
  background: #ddd;
  padding: 24px;
  border-radius: 24px;
}

.preview {
  position: relative;
  width: 100%;
  aspect-ratio: 1.42 / 1;
  background: white;
  overflow: hidden;
  border-radius: 16px;
  touch-action: none;
}

/*
  Grande 470ml 台紙

  上が広く、下が狭い扇形。
*/
.template {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 10%;
  bottom: 10%;

  clip-path: polygon(
    4% 0%,
    96% 0%,
    88% 100%,
    12% 100%
  );

  overflow: hidden;
  border: 2px solid #444;
}

/*
  写真Canvas
*/
#previewCanvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;

  display: block;
}

/* 操作説明 */
.info {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-top: 24px;
  font-size: 18px;
  line-height: 1.6;
}

.controls {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.controls button {
  flex: 1;
  border: none;
  border-radius: 18px;
  padding: 18px 8px;
  font-size: 20px;
  color: #1683ff;
  background: #e9e9e9;
}

.pdfButton {
  width: 100%;
  border: none;
  border-radius: 20px;
  padding: 22px 10px;
  margin-top: 26px;
  background: #555;
  color: white;
  font-size: 23px;
  font-weight: bold;
}

.note {
  color: #777;
  font-size: 17px;
  line-height: 1.6;
  margin-top: 15px;
}

/* ============================
   印刷専用
   ============================ */

#printArea {
  display: none;
}

@media print {

  @page {
    size: A4 portrait;
    margin: 0;
  }

  html,
  body {
    width: 210mm;
    height: 297mm;
    margin: 0;
    padding: 0;
    background: white;
  }

  body > * {
    display: none !important;
  }

  #printArea {
    display: block !important;
    position: relative;

    width: 210mm;
    height: 297mm;

    background: white;
    overflow: hidden;
  }

  /*
    Grande台紙の実寸領域

    幅：約170mm
    高さ：約120mm

    A4中央に配置。
  */
  #printTemplate {
    position: absolute;

    width: 170mm;
    height: 120mm;

    left: 20mm;
    top: 70mm;

    overflow: hidden;

    clip-path: polygon(
      4% 0%,
      96% 0%,
      88% 100%,
      12% 100%
    );
  }

  #printCanvas {
    position: absolute;
    left: 0;
    top: 0;

    width: 170mm;
    height: 120mm;

    display: block;
  }

  /*
    実寸確認用100mmスケール
  */
  #scale100 {
    position: absolute;

    left: 20mm;
    top: 200mm;

    width: 100mm;
    height: 8mm;

    font-family: Arial, sans-serif;
    font-size: 3mm;
    color: black;
  }

  #scaleLine {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100mm;
    height: 0;

    border-top: 0.4mm solid black;
  }

  #scaleLeft,
  #scaleRight {
    position: absolute;

    width: 0;
    height: 3mm;

    border-left: 0.4mm solid black;

    bottom: -1.5mm;
  }

  #scaleLeft {
    left: 0;
  }

  #scaleRight {
    right: 0;
  }

  #printLabel {
    position: absolute;

    left: 20mm;
    top: 211mm;

    font-family: Arial, sans-serif;
    font-size: 3mm;
    color: black;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>
    クリタンメーカー — Grande 470ml
  </h1>

  <div class="subtitle">
    Grande 470ml・湾曲台紙プレビュー
  </div>

  <label class="fileButton" for="photoInput">
    📷 写真を選ぶ
  </label>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
  >

  <div class="previewOuter">

    <div class="preview" id="preview">

      <div class="template">

        <canvas id="previewCanvas"></canvas>

      </div>

    </div>

  </div>

  <div class="info">
    ✓ 写真を読み込みました。<br>
    Grande 470mlの台紙形状に沿って表示しています。
  </div>

  <div class="controls">

    <button id="zoomOut">
      − 縮小
    </button>

    <button id="reset">
      リセット
    </button>

    <button id="zoomIn">
      ＋ 拡大
    </button>

  </div>

  <button class="pdfButton" id="makePDF">
    📄 実寸A4 PDFを作成
  </button>

  <div class="note">
    1本指：写真をつかんで移動<br>
    2本指：ピンチで拡大・縮小<br>
    PDFはA4用紙に実寸で配置します。<br>
    印刷時は「実際のサイズ」「100%」を選択してください。
  </div>

</div>


<!-- ============================
     印刷用A4
     ============================ -->

<div id="printArea">

  <div id="printTemplate">
    <canvas id="printCanvas"></canvas>
  </div>

  <div id="scale100">

    <div id="scaleLine"></div>

    <div id="scaleLeft"></div>
    <div id="scaleRight"></div>

    100 mm

  </div>

  <div id="printLabel">
    Grande 470ml / 実寸テスト
  </div>

</div>


<script>

const input = document.getElementById("photoInput");

const previewCanvas =
  document.getElementById("previewCanvas");

const printCanvas =
  document.getElementById("printCanvas");

const preview =
  document.getElementById("preview");

const ctx =
  previewCanvas.getContext("2d");

const printCtx =
  printCanvas.getContext("2d");

let image = null;


/* =================================
   写真位置・拡大率
   ================================= */

let scale = 1;

let offsetX = 0;
let offsetY = 0;


/* =================================
   Canvasサイズ
   ================================= */

function resizeCanvas() {

  const rect = preview.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  previewCanvas.width =
    rect.width * dpr;

  previewCanvas.height =
    rect.height * dpr;

  previewCanvas.style.width =
    rect.width + "px";

  previewCanvas.style.height =
    rect.height + "px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  drawPreview();
}


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =================================
   写真読み込み
   ================================= */

input.addEventListener(
  "change",
  function() {

    const file = this.files[0];

    if (!file) return;

    const reader =
      new FileReader();

    reader.onload = function(e) {

      const img =
        new Image();

      img.onload = function() {

        image = img;

        scale = 1;

        offsetX = 0;
        offsetY = 0;

        resizeCanvas();

      };

      img.src = e.target.result;

    };

    reader.readAsDataURL(file);

  }
);


/* =================================
   プレビュー描画
   ================================= */

function drawPreview() {

  const rect =
    preview.getBoundingClientRect();

  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  if (!image) return;


  /*
    写真を「cover」で初期配置
  */

  const imageRatio =
    image.width / image.height;

  const boxRatio =
    w / h;

  let baseWidth;
  let baseHeight;

  if (imageRatio > boxRatio) {

    baseHeight = h;

    baseWidth =
      baseHeight * imageRatio;

  } else {

    baseWidth = w;

    baseHeight =
      baseWidth / imageRatio;
  }


  const drawWidth =
    baseWidth * scale;

  const drawHeight =
    baseHeight * scale;


  const x =
    (w - baseWidth) / 2 +
    offsetX;

  const y =
    (h - baseHeight) / 2 +
    offsetY;


  ctx.drawImage(
    image,
    x,
    y,
    drawWidth,
    drawHeight
  );
}


/* =================================
   ズーム
   ================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    function() {

      scale *= 1.15;

      drawPreview();
    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    function() {

      scale /= 1.15;

      drawPreview();
    }
  );


/* =================================
   リセット
   ================================= */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function() {

      scale = 1;

      offsetX = 0;
      offsetY = 0;

      drawPreview();
    }
  );


/* =================================
   1本指ドラッグ
   ================================= */

let dragging = false;

let lastX = 0;
let lastY = 0;


preview.addEventListener(
  "pointerdown",
  function(e) {

    if (e.pointerType === "mouse" ||
        e.pointerType === "touch") {

      dragging = true;

      lastX = e.clientX;
      lastY = e.clientY;

      preview.setPointerCapture(
        e.pointerId
      );
    }
  }
);


preview.addEventListener(
  "pointermove",
  function(e) {

    if (!dragging) return;

    const dx =
      e.clientX - lastX;

    const dy =
      e.clientY - lastY;

    /*
      指を右へ動かしたら
      写真も右へ動く。

      指を左へ動かしたら
      写真も左へ動く。
    */

    offsetX += dx;
    offsetY += dy;

    lastX = e.clientX;
    lastY = e.clientY;

    drawPreview();
  }
);


preview.addEventListener(
  "pointerup",
  function(e) {

    dragging = false;

    try {
      preview.releasePointerCapture(
        e.pointerId
      );
    } catch(err) {}

  }
);


/* =================================
   PDF用Canvas生成
   ================================= */

function createPrintCanvas() {

  /*
    170mm × 120mm

    300dpi相当の高解像度で生成。
  */

  const DPI = 300;

  const MM_TO_PX =
    DPI / 25.4;

  const width =
    Math.round(170 * MM_TO_PX);

  const height =
    Math.round(120 * MM_TO_PX);

  printCanvas.width =
    width;

  printCanvas.height =
    height;

  printCtx.clearRect(
    0,
    0,
    width,
    height
  );

  if (!image) return;


  /*
    プレビューと同じ写真位置を
    170mm × 120mmへ変換する
  */

  const previewRect =
    preview.getBoundingClientRect();

  const pw =
    previewRect.width;

  const ph =
    previewRect.height;


  const imageRatio =
    image.width / image.height;

  const boxRatio =
    pw / ph;


  let baseWidth;
  let baseHeight;

  if (imageRatio > boxRatio) {

    baseHeight = ph;

    baseWidth =
      baseHeight * imageRatio;

  } else {

    baseWidth = pw;

    baseHeight =
      baseWidth / imageRatio;
  }


  const drawWidth =
    baseWidth * scale;

  const drawHeight =
    baseHeight * scale;


  const x =
    (pw - baseWidth) / 2 +
    offsetX;

  const y =
    (ph - baseHeight) / 2 +
    offsetY;


  /*
    プレビュー座標
    ↓
    実寸170×120mm座標
  */

  const sx =
    width / pw;

  const sy =
    height / ph;


  printCtx.drawImage(
    image,

    x * sx,
    y * sy,

    drawWidth * sx,
    drawHeight * sy
  );
}


/* =================================
   PDF / 印刷
   ================================= */

document
  .getElementById("makePDF")
  .addEventListener(
    "click",
    function() {

      if (!image) {

        alert(
          "先に写真を選択してください。"
        );

        return;
      }


      /*
        印刷用画像を作成
      */

      createPrintCanvas();


      /*
        Safariに描画完了を待たせる
      */

      setTimeout(
        function() {

          /*
            iPhone Safariの印刷画面を開く。

            ここから
            共有 → ファイルに保存
            または
            プリンタ選択

            ができます。
          */

          window.print();

        },
        300
      );

    }
  );


/* =================================
   初期化
   ================================= */

resizeCanvas();

</script>

</body>
</html>
