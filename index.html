<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>クリタンメーカー Grande 470ml</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 24px 18px 60px;
}

h1 {
  font-size: 30px;
  line-height: 1.25;
  margin: 0 0 12px;
}

.subtitle {
  color: #666;
  font-size: 18px;
  line-height: 1.5;
  margin-bottom: 24px;
}

.file-button {
  display: block;
  width: 100%;
  padding: 18px;
  border-radius: 18px;
  background: #222;
  color: white;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 28px;
}

.file-button input {
  display: none;
}

.preview-card {
  background: #ddd;
  padding: 14px;
  border-radius: 22px;
}

.preview-frame {
  position: relative;
  width: 100%;
  background: white;
  border-radius: 16px;
  overflow: hidden;
}

#previewCanvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}

.info {
  margin-top: 20px;
  background: white;
  padding: 18px;
  border-radius: 18px;
  font-size: 17px;
  line-height: 1.65;
}

.controls {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

button {
  flex: 1;
  border: none;
  border-radius: 16px;
  padding: 16px 8px;
  font-size: 18px;
  background: #e5e5e5;
  color: #1683d8;
}

.pdf-button {
  width: 100%;
  margin-top: 18px;
  padding: 20px;
  border: none;
  border-radius: 18px;
  background: #555;
  color: white;
  font-size: 21px;
  font-weight: bold;
}

.pdf-button:disabled {
  opacity: 0.45;
}

.help {
  color: #777;
  font-size: 15px;
  line-height: 1.6;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

  <h1>クリタンメーカー — Grande 470ml</h1>

  <div class="subtitle">
    写真を選ぶだけで、クリエイト ユア タンブラー用台紙を作成
  </div>

  <label class="file-button">
    📷 写真を選ぶ
    <input id="fileInput"
           type="file"
           accept="image/*">
  </label>

  <div class="preview-card">
    <div class="preview-frame">
      <canvas id="previewCanvas"></canvas>
    </div>
  </div>

  <div class="info">
    <div id="status">
      写真を選択してください。
    </div>
  </div>

  <div class="controls">
    <button id="zoomOut">− 縮小</button>
    <button id="reset">リセット</button>
    <button id="zoomIn">＋ 拡大</button>
  </div>

  <button id="pdfButton"
          class="pdf-button"
          disabled>
    📄 実寸A4 PDFを作成
  </button>

  <div class="help">
    1本指：写真を移動<br>
    2本指：拡大・縮小<br>
    <br>
    PDFはA4用紙に<strong>実寸</strong>で配置します。<br>
    印刷時は「実際のサイズ / 100%」を選択してください。
  </div>

</div>


<script>

/* =========================================================
   クリタンメーカー
   Grande 470ml
   ========================================================= */

/*
 * A4
 * 210 × 297 mm
 */

/*
 * Grande台紙
 *
 * 今回の重要ポイント：
 * PDF側でもこの寸法を「mm」として直接使用する。
 *
 * 画面表示用canvasのピクセルサイズとは完全に分離する。
 */

const PAPER = {
  width: 210,
  height: 297
};


/*
 * Grande 470ml 台紙
 *
 * 現在のプレビューで使っている
 * 「上が広く、下が狭い」形状をベースにする。
 */

const TEMPLATE = {
  width: 180,
  height: 105,

  topWidth: 180,
  bottomWidth: 164,

  topCurve: 8,
  bottomCurve: 7
};


/* =========================================================
   Canvas
   ========================================================= */

const previewCanvas =
  document.getElementById("previewCanvas");

const ctx =
  previewCanvas.getContext("2d");

const fileInput =
  document.getElementById("fileInput");

const status =
  document.getElementById("status");

const pdfButton =
  document.getElementById("pdfButton");


/* =========================================================
   画像状態
   ========================================================= */

let image = null;

let scale = 1;

let offsetX = 0;
let offsetY = 0;

let startX = 0;
let startY = 0;

let startOffsetX = 0;
let startOffsetY = 0;

let dragging = false;


/* 2本指 */
let pinchStartDistance = 0;
let pinchStartScale = 1;


/* =========================================================
   Canvasサイズ
   ========================================================= */

const PREVIEW_WIDTH = 900;
const PREVIEW_HEIGHT = 600;

previewCanvas.width = PREVIEW_WIDTH;
previewCanvas.height = PREVIEW_HEIGHT;


/* =========================================================
   ファイル読み込み
   ========================================================= */

fileInput.addEventListener("change", function(e) {

  const file = e.target.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {

    const img = new Image();

    img.onload = function() {

      image = img;

      /*
       * 最初は画像が台紙を十分覆う大きさにする。
       */

      const coverScale = Math.max(
        TEMPLATE.width / img.width,
        TEMPLATE.height / img.height
      );

      scale = coverScale;

      offsetX = 0;
      offsetY = 0;

      status.innerHTML =
        "✓ 写真を読み込みました。<br>" +
        "Grande 470mlの台紙形状に合わせて表示しています。";

      pdfButton.disabled = false;

      drawPreview();
    };

    img.src = event.target.result;
  };

  reader.readAsDataURL(file);
});


/* =========================================================
   台紙パス
   ========================================================= */

function getTemplatePath(cx, cy, scaleFactor) {

  const wTop =
    TEMPLATE.topWidth * scaleFactor;

  const wBottom =
    TEMPLATE.bottomWidth * scaleFactor;

  const h =
    TEMPLATE.height * scaleFactor;

  const curveTop =
    TEMPLATE.topCurve * scaleFactor;

  const curveBottom =
    TEMPLATE.bottomCurve * scaleFactor;

  const xTop =
    cx - wTop / 2;

  const xBottom =
    cx - wBottom / 2;

  const yTop =
    cy - h / 2;

  const yBottom =
    cy + h / 2;

  return {
    xTop,
    xBottom,
    yTop,
    yBottom,
    wTop,
    wBottom,
    h,
    curveTop,
    curveBottom
  };
}


/* =========================================================
   プレビュー描画
   ========================================================= */

function drawPreview() {

  ctx.clearRect(
    0,
    0,
    previewCanvas.width,
    previewCanvas.height
  );

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    0,
    0,
    previewCanvas.width,
    previewCanvas.height
  );

  if (!image) {
    return;
  }

  /*
   * プレビュー上の台紙位置
   */

  const previewScale =
    2.7;

  const t =
    getTemplatePath(
      PREVIEW_WIDTH / 2,
      PREVIEW_HEIGHT / 2,
      previewScale
    );


  /*
   * 画像描画
   *
   * ここでは「写真を動かす方向」を
   * iPhoneの直感的な操作に合わせる。
   */

  ctx.save();

  /*
   * 台紙のクリッピング
   */

  ctx.beginPath();

  ctx.moveTo(
    t.xTop,
    t.yTop + t.curveTop
  );

  ctx.quadraticCurveTo(
    PREVIEW_WIDTH / 2,
    t.yTop - t.curveTop,
    t.xTop + t.wTop,
    t.yTop + t.curveTop
  );

  ctx.lineTo(
    t.xBottom + t.wBottom,
    t.yBottom - t.curveBottom
  );

  ctx.quadraticCurveTo(
    PREVIEW_WIDTH / 2,
    t.yBottom + t.curveBottom,
    t.xBottom,
    t.yBottom - t.curveBottom
  );

  ctx.closePath();

  ctx.clip();


  /*
   * 画像
   */

  const imgW =
    image.width * scale;

  const imgH =
    image.height * scale;

  const drawX =
    PREVIEW_WIDTH / 2 -
    imgW / 2 +
    offsetX;

  const drawY =
    PREVIEW_HEIGHT / 2 -
    imgH / 2 +
    offsetY;

  ctx.drawImage(
    image,
    drawX,
    drawY,
    imgW,
    imgH
  );

  ctx.restore();


  /*
   * 台紙の外周線
   */

  ctx.save();

  ctx.strokeStyle = "#555";
  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    t.xTop,
    t.yTop + t.curveTop
  );

  ctx.quadraticCurveTo(
    PREVIEW_WIDTH / 2,
    t.yTop - t.curveTop,
    t.xTop + t.wTop,
    t.yTop + t.curveTop
  );

  ctx.lineTo(
    t.xBottom + t.wBottom,
    t.yBottom - t.curveBottom
  );

  ctx.quadraticCurveTo(
    PREVIEW_WIDTH / 2,
    t.yBottom + t.curveBottom,
    t.xBottom,
    t.yBottom - t.curveBottom
  );

  ctx.closePath();

  ctx.stroke();

  ctx.restore();
}


/* =========================================================
   ズーム
   ========================================================= */

document
.getElementById("zoomIn")
.addEventListener("click", function() {

  scale *= 1.15;

  drawPreview();
});


document
.getElementById("zoomOut")
.addEventListener("click", function() {

  scale /= 1.15;

  drawPreview();
});


/* =========================================================
   リセット
   ========================================================= */

document
.getElementById("reset")
.addEventListener("click", function() {

  if (!image) {
    return;
  }

  const coverScale = Math.max(
    TEMPLATE.width / image.width,
    TEMPLATE.height / image.height
  );

  scale = coverScale;

  offsetX = 0;
  offsetY = 0;

  drawPreview();
});


/* =========================================================
   タッチ操作
   ========================================================= */

previewCanvas.addEventListener(
  "touchstart",
  function(e) {

    e.preventDefault();

    if (!image) {
      return;
    }

    if (e.touches.length === 1) {

      dragging = true;

      startX =
        e.touches[0].clientX;

      startY =
        e.touches[0].clientY;

      startOffsetX =
        offsetX;

      startOffsetY =
        offsetY;

    } else if (e.touches.length === 2) {

      dragging = false;

      pinchStartDistance =
        getTouchDistance(e.touches);

      pinchStartScale =
        scale;
    }

  },
  { passive: false }
);


previewCanvas.addEventListener(
  "touchmove",
  function(e) {

    e.preventDefault();

    if (!image) {
      return;
    }


    /*
     * 1本指
     *
     * ここが今回の重要修正。
     *
     * 指を右へ動かす
     * ↓
     * 写真も右へ動く
     *
     * 指を左へ動かす
     * ↓
     * 写真も左へ動く
     */

    if (
      e.touches.length === 1 &&
      dragging
    ) {

      const dx =
        e.touches[0].clientX -
        startX;

      const dy =
        e.touches[0].clientY -
        startY;

      offsetX =
        startOffsetX + dx * 2.7;

      offsetY =
        startOffsetY + dy * 2.7;

      drawPreview();

    }


    /*
     * 2本指
     */

    else if (
      e.touches.length === 2
    ) {

      const distance =
        getTouchDistance(e.touches);

      if (pinchStartDistance > 0) {

        const ratio =
          distance /
          pinchStartDistance;

        scale =
          pinchStartScale * ratio;

        drawPreview();
      }
    }

  },
  { passive: false }
);


previewCanvas.addEventListener(
  "touchend",
  function(e) {

    if (
      e.touches.length === 0
    ) {

      dragging = false;
      pinchStartDistance = 0;
    }

  }
);


/* =========================================================
   2本指の距離
   ========================================================= */

function getTouchDistance(e) {

  const dx =
    e.touches[0].clientX -
    e.touches[1].clientX;

  const dy =
    e.touches[0].clientY -
    e.touches[1].clientY;

  return Math.sqrt(
    dx * dx +
    dy * dy
  );
}


/* =========================================================
   PDF / 印刷用ページ
   ========================================================= */

/*
 * 今回の最大の修正箇所。
 *
 * プレビューcanvasのサイズを
 * A4に縮小して貼るのではない。
 *
 * SVGを「mm単位」で作り、
 * A4ページに直接配置する。
 */

pdfButton.addEventListener(
  "click",
  function() {

    if (!image) {
      alert("先に写真を選択してください。");
      return;
    }

    createPrintPage();
  }
);


/* =========================================================
   印刷ページ作成
   ========================================================= */

function createPrintPage() {

  /*
   * 高解像度画像として
   * 現在の写真状態を作る。
   *
   * 1mm = 約3.78px
   * 96dpi換算ではなく、
   * SVG側でmmを指定するため、
   * 実寸はブラウザの印刷CSSで決まる。
   */

  const exportWidth =
    1800;

  const exportHeight =
    1200;

  const exportCanvas =
    document.createElement("canvas");

  exportCanvas.width =
    exportWidth;

  exportCanvas.height =
    exportHeight;

  const ec =
    exportCanvas.getContext("2d");

  ec.clearRect(
    0,
    0,
    exportWidth,
    exportHeight
  );


  /*
   * SVGで台紙形状を作る。
   */

  const x =
    (PAPER.width -
     TEMPLATE.width) / 2;

  const y =
    55;


  const topW =
    TEMPLATE.topWidth;

  const bottomW =
    TEMPLATE.bottomWidth;

  const h =
    TEMPLATE.height;


  const topLeft =
    x;

  const topRight =
    x + topW;

  const bottomLeft =
    x +
    (topW - bottomW) / 2;

  const bottomRight =
    bottomLeft +
    bottomW;


  /*
   * 上下の湾曲
   */

  const topCurve =
    TEMPLATE.topCurve;

  const bottomCurve =
    TEMPLATE.bottomCurve;


  const path =
    `
      M ${topLeft} ${y + topCurve}

      Q ${x + topW / 2}
        ${y - topCurve}
        ${topRight}
        ${y + topCurve}

      L ${bottomRight}
        ${y + h - bottomCurve}

      Q ${x + topW / 2}
        ${y + h + bottomCurve}
        ${bottomLeft}
        ${y + h - bottomCurve}

      Z
    `;


  /*
   * 画像をデータURL化
   */

  const imageData =
    imageToDataURL(image);


  /*
   * 画像の表示位置。
   *
   * ここではプレビューと同じ
   * scale / offsetを使用する。
   */

  /*
   * 画像の元サイズ
   */

  const iw =
    image.width;

  const ih =
    image.height;


  /*
   * 台紙中央を基準にする。
   */

  const centerX =
    x + TEMPLATE.width / 2;

  const centerY =
    y + TEMPLATE.height / 2;


  /*
   * 画像サイズ。
   *
   * scaleはプレビューcanvas基準なので、
   * Grande実寸へ変換する。
   */

  const previewScale =
    2.7;

  const pxPerMm =
    previewScale;


  const imgW =
    iw * scale / pxPerMm;

  const imgH =
    ih * scale / pxPerMm;


  const imgX =
    centerX -
    imgW / 2 +
    offsetX / pxPerMm;

  const imgY =
    centerY -
    imgH / 2 +
    offsetY / pxPerMm;


  /*
   * A4印刷用HTML
   */

  const printHTML = `
<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Grande 470ml 台紙</title>

<style>

@page {
  size: A4 portrait;
  margin: 0;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 210mm;
  height: 297mm;
  background: white;
}

.page {
  position: relative;
  width: 210mm;
  height: 297mm;
  overflow: hidden;
}

svg {
  display: block;
  width: 210mm;
  height: 297mm;
}

.instructions {
  position: absolute;
  top: 8mm;
  left: 10mm;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
  font-size: 4mm;
  color: #222;
}

@media print {

  .instructions {
    display: none;
  }

}

</style>

</head>

<body>

<div class="page">

<div class="instructions">
共有 → プリント または「ファイルに保存」してください。<br>
印刷時は「実際のサイズ / 100%」を選択してください。
</div>


<svg
  xmlns="http://www.w3.org/2000/svg"
  width="210mm"
  height="297mm"
  viewBox="0 0 210 297">

<defs>

<clipPath id="templateClip">

<path d="${path}" />

</clipPath>

</defs>


<!-- 写真 -->

<image
  href="${imageData}"
  x="${imgX}"
  y="${imgY}"
  width="${imgW}"
  height="${imgH}"
  preserveAspectRatio="none"
  clip-path="url(#templateClip)"
/>


<!-- 台紙外周 -->

<path
  d="${path}"
  fill="none"
  stroke="#444"
  stroke-width="0.4"
/>


<!-- 100mm確認スケール -->

<line
  x1="20"
  y1="270"
  x2="120"
  y2="270"
  stroke="#444"
  stroke-width="0.4"
/>

<line
  x1="20"
  y1="268"
  x2="20"
  y2="272"
  stroke="#444"
  stroke-width="0.4"
/>

<line
  x1="120"
  y1="268"
  x2="120"
  y2="272"
  stroke="#444"
  stroke-width="0.4"
/>

<text
  x="20"
  y="266"
  font-size="3"
  fill="#444">
100 mm
</text>


<text
  x="20"
  y="276"
  font-size="2.5"
  fill="#444">
Grande 470ml / 実寸テスト
</text>

</svg>

</div>

</body>
</html>
`;


  /*
   * 新しいページを開く
   */

  const newWindow =
    window.open("", "_blank");

  if (!newWindow) {

    alert(
      "ポップアップがブロックされています。Safariの設定を確認してください。"
    );

    return;
  }

  newWindow.document.open();

  newWindow.document.write(
    printHTML
  );

  newWindow.document.close();
}


/* =========================================================
   Image → DataURL
   ========================================================= */

function imageToDataURL(img) {

  const canvas =
    document.createElement("canvas");

  canvas.width =
    img.naturalWidth ||
    img.width;

  canvas.height =
    img.naturalHeight ||
    img.height;

  const c =
    canvas.getContext("2d");

  c.drawImage(
    img,
    0,
    0
  );

  return canvas.toDataURL(
    "image/jpeg",
    0.95
  );
}


/* =========================================================
   初期描画
   ========================================================= */

drawPreview();

</script>

</body>
</html>
