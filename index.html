<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<title>クリタンメーカー Grande 470ml</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f3f3;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

.wrap {
  max-width: 760px;
  margin: auto;
  padding: 18px;
}

h1 {
  font-size: 23px;
  margin: 0 0 5px;
}

.note {
  color: #666;
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 16px;
}

.photoButton {
  display: block;
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  background: #222;
  color: white;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

input[type="file"] {
  display: none;
}

.previewBox {
  margin-top: 16px;
  padding: 12px;
  background: #ddd;
  border-radius: 14px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: white;
  border-radius: 8px;
  touch-action: none;
}

.status {
  margin-top: 12px;
  padding: 12px;
  background: white;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.controls button {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 12px 5px;
  font-size: 15px;
}

.pdfButton {
  width: 100%;
  margin-top: 14px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #555;
  color: white;
  font-size: 17px;
  font-weight: 700;
}

.pdfButton:disabled {
  background: #aaa;
}

.help {
  color: #777;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 9px;
}

</style>
</head>


<body>

<div class="wrap">

<h1>
クリタンメーカー — Grande 470ml
</h1>

<p class="note">
STEP 3：写真を調整して、実寸A4 PDFを作成
</p>


<label class="photoButton">

📷 写真を選ぶ

<input
  id="photo"
  type="file"
  accept="image/*">

</label>


<div class="previewBox">

<canvas
  id="canvas"
  width="1200"
  height="900">
</canvas>

</div>


<div
  id="status"
  class="status">

写真を選択してください。

</div>


<div class="controls">

<button id="smaller">
− 縮小
</button>

<button id="reset">
リセット
</button>

<button id="larger">
＋ 拡大
</button>

</div>


<button
  id="pdfButton"
  class="pdfButton"
  disabled>

📄 実寸A4 PDFを作成

</button>


<div class="help">

1本指：写真を指でつかんで移動<br>
2本指：ピンチで拡大・縮小<br>
PDFはA4用紙に実寸で配置します。<br>
今回のPDFには実寸確認用の100mmスケールを入れています。

</div>

</div>


<script>


/* =================================================
   Grande 470ml 台紙データ
   ================================================= */

const R_IN =
  693.51882249879;

const R_OUT =
  863.14001699879;

const ANGLE =
  16.336130 * Math.PI / 180;


/* =================================================
   Canvas
   ================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const photoInput =
  document.getElementById("photo");

const status =
  document.getElementById("status");

const pdfButton =
  document.getElementById("pdfButton");


/* =================================================
   写真状態
   ================================================= */

let image = null;

let zoom = 1;

let moveX = 0;

let moveY = 0;


/* =================================================
   タッチ状態
   ================================================= */

let dragging = false;

let lastX = 0;

let lastY = 0;

let pinchDistance = 0;

let pinchZoom = 1;


/* =================================================
   台紙ジオメトリ
   ================================================= */

function getGeometry() {

  const centerAngle =
    -Math.PI / 2;

  const a1 =
    centerAngle - ANGLE / 2;

  const a2 =
    centerAngle + ANGLE / 2;


  const points = [

    point(R_OUT, a1),
    point(R_OUT, a2),

    point(R_IN, a1),
    point(R_IN, a2)

  ];


  let minX = Infinity;
  let maxX = -Infinity;

  let minY = Infinity;
  let maxY = -Infinity;


  points.forEach(p => {

    minX =
      Math.min(minX, p.x);

    maxX =
      Math.max(maxX, p.x);

    minY =
      Math.min(minY, p.y);

    maxY =
      Math.max(maxY, p.y);

  });


  return {

    centerAngle,
    a1,
    a2,

    minX,
    maxX,

    minY,
    maxY,

    width:
      maxX - minX,

    height:
      maxY - minY

  };

}


function point(r, angle) {

  return {

    x:
      r * Math.cos(angle),

    y:
      r * Math.sin(angle)

  };

}


/* =================================================
   写真Canvas作成
   ================================================= */

function createSourceCanvas() {

  const sourceCanvas =
    document.createElement("canvas");

  sourceCanvas.width =
    image.naturalWidth;

  sourceCanvas.height =
    image.naturalHeight;


  const sourceCtx =
    sourceCanvas.getContext("2d");


  sourceCtx.drawImage(
    image,
    0,
    0
  );


  return sourceCanvas;

}


/* =================================================
   台紙画像を作る
   ================================================= */

function createTemplateCanvas(
  outputWidth,
  outputHeight
) {

  const outputCanvas =
    document.createElement("canvas");

  outputCanvas.width =
    outputWidth;

  outputCanvas.height =
    outputHeight;


  const outputCtx =
    outputCanvas.getContext("2d");


  outputCtx.fillStyle =
    "white";

  outputCtx.fillRect(
    0,
    0,
    outputWidth,
    outputHeight
  );


  if (!image) {

    return outputCanvas;

  }


  const geo =
    getGeometry();


  const margin = 45;


  const scale =
    Math.min(

      (outputWidth - margin * 2) /
        geo.width,

      (outputHeight - margin * 2) /
        geo.height

    );


  const centerX =
    outputWidth / 2;

  const centerY =
    outputHeight / 2;


  const cx =
    (geo.minX + geo.maxX) / 2;

  const cy =
    (geo.minY + geo.maxY) / 2;


  const sourceCanvas =
    createSourceCanvas();


  const sourceCtx =
    sourceCanvas.getContext("2d");


  const source =
    sourceCtx.getImageData(
      0,
      0,
      sourceCanvas.width,
      sourceCanvas.height
    );


  const sourcePixels =
    source.data;


  const output =
    outputCtx.createImageData(
      outputWidth,
      outputHeight
    );


  const pixels =
    output.data;


  for (
    let py = 0;
    py < outputHeight;
    py++
  ) {

    const worldY =
      cy +
      (py - centerY) / scale;


    for (
      let px = 0;
      px < outputWidth;
      px++
    ) {

      const worldX =
        cx +
        (px - centerX) / scale;


      const radius =
        Math.sqrt(
          worldX * worldX +
          worldY * worldY
        );


      if (
        radius < R_IN ||
        radius > R_OUT
      ) {

        continue;

      }


      const angle =
        Math.atan2(
          worldY,
          worldX
        );


      const localAngle =
        angle + Math.PI / 2;


      if (
        localAngle <
          -ANGLE / 2 ||

        localAngle >
          ANGLE / 2
      ) {

        continue;

      }


      let u =
        (
          localAngle +
          ANGLE / 2
        ) / ANGLE;


      let v =
        (
          R_OUT - radius
        ) /
        (
          R_OUT - R_IN
        );


      /*
       * 拡大縮小
       */

      u =
        (
          u - 0.5
        ) / zoom
        + 0.5;


      v =
        (
          v - 0.5
        ) / zoom
        + 0.5;


      /*
       * 位置移動

       * 指と写真が同じ方向に動く
       */

      u -= moveX;

      v -= moveY;


      if (
        u < 0 ||
        u > 1 ||
        v < 0 ||
        v > 1
      ) {

        continue;

      }


      const sx =
        Math.min(
          sourceCanvas.width - 1,

          Math.max(
            0,

            Math.floor(
              u *
              sourceCanvas.width
            )
          )

        );


      const sy =
        Math.min(
          sourceCanvas.height - 1,

          Math.max(
            0,

            Math.floor(
              v *
              sourceCanvas.height
            )
          )

        );


      const sourceIndex =
        (
          sy *
          sourceCanvas.width +
          sx
        ) * 4;


      const destIndex =
        (
          py *
          outputWidth +
          px
        ) * 4;


      pixels[destIndex] =
        sourcePixels[sourceIndex];

      pixels[destIndex + 1] =
        sourcePixels[sourceIndex + 1];

      pixels[destIndex + 2] =
        sourcePixels[sourceIndex + 2];

      pixels[destIndex + 3] =
        255;

    }

  }


  outputCtx.putImageData(
    output,
    0,
    0
  );


  /*
   * 輪郭線
   */

  drawOutlineToContext(
    outputCtx,
    geo,
    scale,
    centerX,
    centerY,
    cx,
    cy
  );


  return outputCanvas;

}


/* =================================================
   輪郭線
   ================================================= */

function drawOutlineToContext(
  targetCtx,
  geo,
  scale,
  centerX,
  centerY,
  cx,
  cy
) {

  targetCtx.save();

  targetCtx.beginPath();

  targetCtx.lineWidth = 3;

  targetCtx.strokeStyle = "#222";


  /*
   * 外側円弧
   */

  for (
    let i = 0;
    i <= 120;
    i++
  ) {

    const angle =
      geo.a1 +
      ANGLE *
      i /
      120;


    const p =
      point(
        R_OUT,
        angle
      );


    const x =
      centerX +
      (p.x - cx) *
      scale;


    const y =
      centerY +
      (p.y - cy) *
      scale;


    if (i === 0) {

      targetCtx.moveTo(
        x,
        y
      );

    } else {

      targetCtx.lineTo(
        x,
        y
      );

    }

  }


  /*
   * 右側
   */

  const right =
    point(
      R_IN,
      geo.a2
    );


  targetCtx.lineTo(

    centerX +
    (right.x - cx) *
    scale,

    centerY +
    (right.y - cy) *
    scale

  );


  /*
   * 内側円弧
   */

  for (
    let i = 120;
    i >= 0;
    i--
  ) {

    const angle =
      geo.a1 +
      ANGLE *
      i /
      120;


    const p =
      point(
        R_IN,
        angle
      );


    const x =
      centerX +
      (p.x - cx) *
      scale;


    const y =
      centerY +
      (p.y - cy) *
      scale;


    targetCtx.lineTo(
      x,
      y
    );

  }


  /*
   * 左側
   */

  const left =
    point(
      R_OUT,
      geo.a1
    );


  targetCtx.lineTo(

    centerX +
    (left.x - cx) *
    scale,

    centerY +
    (left.y - cy) *
    scale

  );


  targetCtx.closePath();

  targetCtx.stroke();

  targetCtx.restore();

}


/* =================================================
   プレビュー
   ================================================= */

function render() {

  const preview =
    createTemplateCanvas(
      canvas.width,
      canvas.height
    );


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.drawImage(
    preview,
    0,
    0
  );

}


/* =================================================
   写真選択
   ================================================= */

photoInput.addEventListener(
  "change",
  function() {

    const file =
      photoInput.files[0];

    if (!file) {
      return;
    }


    const url =
      URL.createObjectURL(
        file
      );


    image =
      new Image();


    image.onload =
      function() {

        zoom = 1;

        moveX = 0;

        moveY = 0;


        pdfButton.disabled =
          false;


        status.innerHTML =
          "✓ 写真を読み込みました。<br>" +
          "位置と大きさを調整できます。";


        render();


        URL.revokeObjectURL(
          url
        );

      };


    image.onerror =
      function() {

        status.textContent =
          "写真を読み込めませんでした。";

      };


    image.src =
      url;

  }
);


/* =================================================
   1本指移動
   ================================================= */

canvas.addEventListener(
  "touchstart",
  function(e) {

    if (
      e.touches.length === 1
    ) {

      dragging = true;

      lastX =
        e.touches[0].clientX;

      lastY =
        e.touches[0].clientY;

    }


    if (
      e.touches.length === 2
    ) {

      dragging = false;

      pinchDistance =
        getDistance(
          e.touches[0],
          e.touches[1]
        );

      pinchZoom =
        zoom;

    }

  },
  {
    passive: false
  }
);


/* =================================================
   タッチ移動
   ================================================= */

canvas.addEventListener(
  "touchmove",
  function(e) {

    e.preventDefault();


    if (
      e.touches.length === 1 &&
      dragging
    ) {

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;


      const dx =
        x - lastX;

      const dy =
        y - lastY;


      lastX = x;

      lastY = y;


      moveX +=
        dx /
        canvas.clientWidth;


      moveY +=
        dy /
        canvas.clientHeight;


      render();

    }


    if (
      e.touches.length === 2
    ) {

      const currentDistance =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      zoom =
        pinchZoom *
        currentDistance /
        pinchDistance;


      zoom =
        Math.max(
          0.25,

          Math.min(
            5,

            zoom
          )
        );


      render();

    }

  },
  {
    passive: false
  }
);


/* =================================================
   タッチ終了
   ================================================= */

canvas.addEventListener(
  "touchend",
  function(e) {

    if (
      e.touches.length === 0
    ) {

      dragging = false;

    }

  }
);


/* =================================================
   2点間距離
   ================================================= */

function getDistance(a, b) {

  return Math.sqrt(

    Math.pow(
      a.clientX -
      b.clientX,
      2
    )

    +

    Math.pow(
      a.clientY -
      b.clientY,
      2
    )

  );

}


/* =================================================
   拡大
   ================================================= */

document
  .getElementById("larger")
  .addEventListener(
    "click",
    function() {

      zoom =
        Math.min(
          5,
          zoom * 1.15
        );

      render();

    }
  );


/* =================================================
   縮小
   ================================================= */

document
  .getElementById("smaller")
  .addEventListener(
    "click",
    function() {

      zoom =
        Math.max(
          0.25,
          zoom / 1.15
        );

      render();

    }
  );


/* =================================================
   リセット
   ================================================= */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function() {

      zoom = 1;

      moveX = 0;

      moveY = 0;

      render();

    }
  );


/* =================================================
   PDF作成
   ================================================= */

pdfButton.addEventListener(
  "click",
  function() {

    if (!image) {

      alert(
        "先に写真を選択してください。"
      );

      return;

    }


    status.innerHTML =
      "PDFを作成しています……";


    /*
     * A4を300dpi相当で作成

     * 210mm × 297mm
     *
     * 1 inch = 25.4mm
     *
     * 300dpi
     */

    const DPI = 300;

    const MM_PER_INCH = 25.4;

    const A4_WIDTH_MM = 210;

    const A4_HEIGHT_MM = 297;


    const pdfWidth =
      Math.round(
        A4_WIDTH_MM /
        MM_PER_INCH *
        DPI
      );


    const pdfHeight =
      Math.round(
        A4_HEIGHT_MM /
        MM_PER_INCH *
        DPI
      );


    /*
     * A4キャンバス
     */

    const pdfCanvas =
      document.createElement("canvas");

    pdfCanvas.width =
      pdfWidth;

    pdfCanvas.height =
      pdfHeight;


    const pdfCtx =
      pdfCanvas.getContext("2d");


    pdfCtx.fillStyle =
      "white";

    pdfCtx.fillRect(
      0,
      0,
      pdfWidth,
      pdfHeight
    );


    /*
     * 現在のプレビューを
     * A4中央に配置
     */

    const template =
      createTemplateCanvas(
        1800,
        1350
      );


    /*
     * 台紙をA4上に配置

     * A4幅いっぱいにはせず、
     * 実寸基準で配置する。

     * ここでは現在の台紙比率を
     * 実寸スケールへ変換。
     */

    const geo =
      getGeometry();


    const scaleX =
      1800 /
      (
        geo.maxX -
        geo.minX
      );


    const mmWidth =
      (
        geo.maxX -
        geo.minX
      ) /
      10;


    const targetWidth =
      Math.round(
        mmWidth /
        MM_PER_INCH *
        DPI *
        scaleX
      );


    /*
     * 台紙の実寸配置サイズ

     * Grande台紙の幅を
     * ジオメトリから計算。
     */

    const actualWidthMM =
      (
        geo.maxX -
        geo.minX
      ) / 10;


    const actualHeightMM =
      (
        geo.maxY -
        geo.minY
      ) / 10;


    const targetW =
      Math.round(
        actualWidthMM /
        MM_PER_INCH *
        DPI
      );


    const targetH =
      Math.round(
        actualHeightMM /
        MM_PER_INCH *
        DPI
      );


    const left =
      Math.round(
        (
          pdfWidth -
          targetW
        ) / 2
      );


    const top =
      Math.round(
        (
          pdfHeight -
          targetH
        ) / 2
      );


    /*
     * 台紙を描画
     */

    pdfCtx.drawImage(

      template,

      left,
      top,

      targetW,
      targetH

    );


    /*
     * 100mm確認線

     * A4下部に配置
     */

    const scale100 =
      Math.round(
        100 /
        MM_PER_INCH *
        DPI
      );


    const rulerY =
      pdfHeight - 120;


    pdfCtx.strokeStyle =
      "#000";

    pdfCtx.lineWidth =
      3;


    pdfCtx.beginPath();

    pdfCtx.moveTo(
      100,
      rulerY
    );

    pdfCtx.lineTo(
      100 + scale100,
      rulerY
    );

    pdfCtx.stroke();


    pdfCtx.beginPath();

    pdfCtx.moveTo(
      100,
      rulerY - 12
    );

    pdfCtx.lineTo(
      100,
      rulerY + 12
    );

    pdfCtx.moveTo(
      100 + scale100,
      rulerY - 12
    );

    pdfCtx.lineTo(
      100 + scale100,
      rulerY + 12
    );

    pdfCtx.stroke();


    pdfCtx.fillStyle =
      "#000";

    pdfCtx.font =
      "24px sans-serif";

    pdfCtx.fillText(
      "100 mm",
      100,
      rulerY - 20
    );


    pdfCtx.font =
      "20px sans-serif";

    pdfCtx.fillText(
      "Grande 470ml / 実寸テスト",
      100,
      pdfHeight - 55
    );


    /*
     * PNGとして保存用データ作成
     */

    const dataUrl =
      pdfCanvas.toDataURL(
        "image/png"
      );


    /*
     * ブラウザ標準機能で
     * PDF保存できるようにする。

     * PNGを新しい画面で表示し、
     * iPhoneの共有メニューから
     * 「プリント」または
     * 「ファイルに保存」を使う。
     */

    const newWindow =
      window.open();


    if (!newWindow) {

      status.innerHTML =
        "新しい画面を開けませんでした。<br>" +
        "Safariのポップアップ設定を確認してください。";

      return;

    }


    newWindow.document.write(`

      <!doctype html>

      <html lang="ja">

      <head>

      <meta charset="utf-8">

      <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1">

      <title>
      Grande 470ml 実寸テスト
      </title>

      <style>

      body {
        margin: 0;
        padding: 20px;
        background: #eee;
        text-align: center;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      img {
        max-width: 100%;
        height: auto;
        background: white;
      }

      p {
        font-size: 14px;
        line-height: 1.5;
      }

      </style>

      </head>

      <body>

      <p>
      この画面を共有 → プリント<br>
      または「ファイルに保存」してください。<br>
      印刷時は「実際のサイズ / 100%」を選択してください。
      </p>

      <img
        src="${dataUrl}"
      >

      </body>

      </html>

    `);


    newWindow.document.close();


    status.innerHTML =
      "✓ 実寸A4テストデータを作成しました。<br>" +
      "共有 → プリント、またはファイルに保存してください。";

  }
);


/* =================================================
   初期表示
   ================================================= */

render();

</script>

</body>
</html>
