<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<title>クリタンメーカー Grande 470ml</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f3f3;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

.wrap {
  max-width: 760px;
  margin: auto;
  padding: 18px;
}

h1 {
  font-size: 23px;
  margin: 0 0 5px;
}

.note {
  color: #666;
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 16px;
}

.photoButton {
  display: block;
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  background: #222;
  color: white;
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

input[type="file"] {
  display: none;
}

.previewBox {
  margin-top: 16px;
  padding: 12px;
  background: #ddd;
  border-radius: 14px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: white;
  border-radius: 8px;
  touch-action: none;
}

.status {
  margin-top: 12px;
  padding: 12px;
  background: white;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.5;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.controls button {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 12px 5px;
  font-size: 15px;
}

.help {
  color: #777;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 9px;
}

</style>
</head>

<body>

<div class="wrap">

<h1>
クリタンメーカー — Grande 470ml
</h1>

<p class="note">
STEP 2.2：Grande 470ml・正しい上下方向の湾曲プレビュー
</p>

<label class="photoButton">

📷 写真を選ぶ

<input
  id="photo"
  type="file"
  accept="image/*"
>

</label>

<div class="previewBox">

<canvas
  id="canvas"
  width="1200"
  height="900">
</canvas>

</div>

<div
  id="status"
  class="status">

写真を選択してください。

</div>

<div class="controls">

<button id="smaller">
− 縮小
</button>

<button id="reset">
リセット
</button>

<button id="larger">
＋ 拡大
</button>

</div>

<div class="help">

1本指：写真を上下左右に移動<br>
2本指：写真を拡大・縮小

</div>

</div>


<script>

/* =================================================
   Grande 470ml 実寸データ
   ================================================= */

const R_IN = 693.51882249879;

const R_OUT = 863.14001699879;

const ANGLE =
  16.336130 * Math.PI / 180;


/* =================================================
   Canvas
   ================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const photoInput =
  document.getElementById("photo");

const status =
  document.getElementById("status");


/* =================================================
   写真状態
   ================================================= */

let image = null;

let zoom = 1;

let moveX = 0;

let moveY = 0;


/* =================================================
   タッチ状態
   ================================================= */

let dragging = false;

let lastX = 0;

let lastY = 0;

let pinchDistance = 0;

let pinchZoom = 1;


/* =================================================
   台紙ジオメトリ
   =================================================

   重要：

   画面上では

       上 = R_OUT
       下 = R_IN

   とする。

   つまり、

       上：広い
       下：狭い

   になる。

   画面のY座標は

       0 = 上
       H = 下

   なので、今回は数学座標の
   上下反転を行わない。
   ================================================= */

function getGeometry() {

  const centerAngle =
    -Math.PI / 2;

  const a1 =
    centerAngle - ANGLE / 2;

  const a2 =
    centerAngle + ANGLE / 2;


  const points = [

    point(R_OUT, a1),
    point(R_OUT, a2),

    point(R_IN, a1),
    point(R_IN, a2)

  ];


  let minX = Infinity;
  let maxX = -Infinity;

  let minY = Infinity;
  let maxY = -Infinity;


  points.forEach(p => {

    minX = Math.min(minX, p.x);
    maxX = Math.max(maxX, p.x);

    minY = Math.min(minY, p.y);
    maxY = Math.max(maxY, p.y);

  });


  return {

    centerAngle,

    a1,
    a2,

    minX,
    maxX,

    minY,
    maxY,

    width:
      maxX - minX,

    height:
      maxY - minY

  };

}


function point(r, angle) {

  return {

    x:
      r * Math.cos(angle),

    y:
      r * Math.sin(angle)

  };

}


/* =================================================
   描画
   ================================================= */

function render() {

  const W =
    canvas.width;

  const H =
    canvas.height;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.fillStyle =
    "white";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  if (!image) {
    return;
  }


  const geo =
    getGeometry();


  const margin = 45;


  const scale =
    Math.min(

      (W - margin * 2) /
        geo.width,

      (H - margin * 2) /
        geo.height

    );


  const centerX =
    W / 2;

  const centerY =
    H / 2;


  /*
   * 台紙中心
   */

  const cx =
    (geo.minX + geo.maxX) / 2;

  const cy =
    (geo.minY + geo.maxY) / 2;


  /*
   * 元画像
   */

  const sourceCanvas =
    document.createElement("canvas");

  sourceCanvas.width =
    image.naturalWidth;

  sourceCanvas.height =
    image.naturalHeight;


  const sourceCtx =
    sourceCanvas.getContext("2d");


  sourceCtx.drawImage(
    image,
    0,
    0
  );


  const source =
    sourceCtx.getImageData(
      0,
      0,
      sourceCanvas.width,
      sourceCanvas.height
    );


  const sourcePixels =
    source.data;


  /*
   * 出力
   */

  const output =
    ctx.createImageData(
      W,
      H
    );


  const pixels =
    output.data;


  /* =================================================
     各画面ピクセルを台紙座標へ変換
     ================================================= */

  for (
    let py = 0;
    py < H;
    py++
  ) {


    /*
     * ここが前回との最大の違い。

     * Canvasの画面座標をそのまま
     * 「上→下」として扱う。

     * 上がR_OUT
     * 下がR_IN
     *
     * なので上下反転しない。
     */

    const worldY =
      cy +
      (py - centerY) / scale;


    for (
      let px = 0;
      px < W;
      px++
    ) {


      const worldX =
        cx +
        (px - centerX) / scale;


      /*
       * 半径
       */

      const radius =
        Math.sqrt(
          worldX * worldX +
          worldY * worldY
        );


      /*
       * 角度
       */

      const angle =
        Math.atan2(
          worldY,
          worldX
        );


      /*
       * 台紙外
       */

      if (
        radius < R_IN ||
        radius > R_OUT
      ) {

        continue;

      }


      /*
       * 中心角を基準にする
       */

      let localAngle =
        angle + Math.PI / 2;


      if (
        localAngle <
          -ANGLE / 2 ||

        localAngle >
          ANGLE / 2
      ) {

        continue;

      }


      /*
       * 左 → 右
       *
       * 左 = 0
       * 右 = 1
       */

      let u =
        (
          localAngle +
          ANGLE / 2
        ) / ANGLE;


      /*
       * 上 → 下
       *
       * 外側 = 上
       * 内側 = 下
       *
       * 上 = 0
       * 下 = 1
       */

      let v =
        (
          R_OUT - radius
        ) /
        (
          R_OUT - R_IN
        );


      /*
       * 拡大・縮小
       */

      u =
        (
          u - 0.5
        ) / zoom
        + 0.5;


      v =
        (
          v - 0.5
        ) / zoom
        + 0.5;


      /*
       * 移動
       */

      u += moveX;

      v += moveY;


      /*
       * 写真範囲外
       */

      if (
        u < 0 ||
        u > 1 ||
        v < 0 ||
        v > 1
      ) {

        continue;

      }


      /*
       * 元画像座標
       */

      const sx =
        Math.min(
          sourceCanvas.width - 1,

          Math.max(
            0,

            Math.floor(
              u *
              sourceCanvas.width
            )
          )
        );


      const sy =
        Math.min(
          sourceCanvas.height - 1,

          Math.max(
            0,

            Math.floor(
              v *
              sourceCanvas.height
            )
          )
        );


      const sourceIndex =
        (
          sy *
          sourceCanvas.width +
          sx
        ) * 4;


      const destIndex =
        (
          py *
          W +
          px
        ) * 4;


      pixels[destIndex] =
        sourcePixels[sourceIndex];

      pixels[destIndex + 1] =
        sourcePixels[sourceIndex + 1];

      pixels[destIndex + 2] =
        sourcePixels[sourceIndex + 2];

      pixels[destIndex + 3] =
        255;

    }

  }


  ctx.putImageData(
    output,
    0,
    0
  );


  /*
   * 台紙輪郭
   */

  drawOutline(
    geo,
    scale,
    centerX,
    centerY,
    cx,
    cy
  );

}


/* =================================================
   台紙輪郭
   ================================================= */

function drawOutline(
  geo,
  scale,
  centerX,
  centerY,
  cx,
  cy
) {

  ctx.save();

  ctx.beginPath();

  ctx.lineWidth = 3;

  ctx.strokeStyle = "#222";


  /*
   * 上側
   *
   * R_OUT
   */

  for (
    let i = 0;
    i <= 120;
    i++
  ) {

    const angle =
      geo.a1 +
      ANGLE *
      i /
      120;


    const p =
      point(
        R_OUT,
        angle
      );


    const x =
      centerX +
      (p.x - cx) *
      scale;


    const y =
      centerY +
      (p.y - cy) *
      scale;


    if (i === 0) {

      ctx.moveTo(
        x,
        y
      );

    } else {

      ctx.lineTo(
        x,
        y
      );

    }

  }


  /*
   * 右側
   */

  const right =
    point(
      R_IN,
      geo.a2
    );


  ctx.lineTo(

    centerX +
    (right.x - cx) *
    scale,

    centerY +
    (right.y - cy) *
    scale

  );


  /*
   * 下側
   *
   * R_IN
   */

  for (
    let i = 120;
    i >= 0;
    i--
  ) {

    const angle =
      geo.a1 +
      ANGLE *
      i /
      120;


    const p =
      point(
        R_IN,
        angle
      );


    const x =
      centerX +
      (p.x - cx) *
      scale;


    const y =
      centerY +
      (p.y - cy) *
      scale;


    ctx.lineTo(
      x,
      y
    );

  }


  /*
   * 左側
   */

  const left =
    point(
      R_OUT,
      geo.a1
    );


  ctx.lineTo(

    centerX +
    (left.x - cx) *
    scale,

    centerY +
    (left.y - cy) *
    scale

  );


  ctx.closePath();

  ctx.stroke();

  ctx.restore();

}


/* =================================================
   写真選択
   ================================================= */

photoInput.addEventListener(
  "change",
  function() {

    const file =
      photoInput.files[0];

    if (!file) {
      return;
    }


    const url =
      URL.createObjectURL(
        file
      );


    image =
      new Image();


    image.onload =
      function() {

        zoom = 1;

        moveX = 0;

        moveY = 0;


        status.innerHTML =
          "✓ 写真を読み込みました。<br>" +
          "Grande 470mlの台紙形状に合わせて表示しています。";


        render();


        URL.revokeObjectURL(
          url
        );

      };


    image.onerror =
      function() {

        status.textContent =
          "写真を読み込めませんでした。";

      };


    image.src =
      url;

  }
);


/* =================================================
   1本指移動
   ================================================= */

canvas.addEventListener(
  "touchstart",
  function(e) {

    if (
      e.touches.length === 1
    ) {

      dragging = true;

      lastX =
        e.touches[0].clientX;

      lastY =
        e.touches[0].clientY;

    }


    if (
      e.touches.length === 2
    ) {

      dragging = false;

      pinchDistance =
        getDistance(
          e.touches[0],
          e.touches[1]
        );

      pinchZoom =
        zoom;

    }

  },
  {
    passive: false
  }
);


/* =================================================
   タッチ移動
   ================================================= */

canvas.addEventListener(
  "touchmove",
  function(e) {

    e.preventDefault();


    if (
      e.touches.length === 1 &&
      dragging
    ) {

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;


      const dx =
        x - lastX;

      const dy =
        y - lastY;


      lastX = x;

      lastY = y;


      moveX +=
        dx /
        canvas.clientWidth;


      moveY +=
        dy /
        canvas.clientHeight;


      render();

    }


    if (
      e.touches.length === 2
    ) {

      const current =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      zoom =
        pinchZoom *
        current /
        pinchDistance;


      zoom =
        Math.max(
          0.25,

          Math.min(
            5,
            zoom
          )
        );


      render();

    }

  },
  {
    passive: false
  }
);


/* =================================================
   タッチ終了
   ================================================= */

canvas.addEventListener(
  "touchend",
  function() {

    dragging = false;

  }
);


/* =================================================
   2点間距離
   ================================================= */

function getDistance(a, b) {

  return Math.sqrt(

    Math.pow(
      a.clientX -
      b.clientX,
      2
    )

    +

    Math.pow(
      a.clientY -
      b.clientY,
      2
    )

  );

}


/* =================================================
   拡大
   ================================================= */

document
  .getElementById("larger")
  .addEventListener(
    "click",
    function() {

      zoom =
        Math.min(
          5,
          zoom * 1.15
        );

      render();

    }
  );


/* =================================================
   縮小
   ================================================= */

document
  .getElementById("smaller")
  .addEventListener(
    "click",
    function() {

      zoom =
        Math.max(
          0.25,
          zoom / 1.15
        );

      render();

    }
  );


/* =================================================
   リセット
   ================================================= */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function() {

      zoom = 1;

      moveX = 0;

      moveY = 0;

      render();

    }
  );


/* =================================================
   初期表示
   ================================================= */

render();

</script>

</body>
</html>
