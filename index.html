<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>クリタンメーカー Grande 470ml</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f5;
  color: #222;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container {
  max-width: 760px;
  margin: 0 auto;

  padding:
    24px
    18px
    60px;
}

h1 {
  font-size: 30px;
  line-height: 1.25;

  margin:
    0
    0
    12px;
}

.subtitle {
  color: #666;

  font-size: 18px;
  line-height: 1.5;

  margin-bottom: 24px;
}

.file-button {

  display: block;

  width: 100%;

  padding: 18px;

  border-radius: 18px;

/* ===========================

.preview-card {

<body>


<div class="container">


  <h1>
    クリタンメーカー — Grande 470ml
  </h1>


  <div class="subtitle">

    写真を選ぶだけで、
    クリエイト ユア タンブラー用台紙を作成

  </div>


  <!-- 写真選択 -->

  <label class="file-button">

    📷 写真を選ぶ

    <input
      id="fileInput"
      type="file"
      accept="image/*">

  </label>


  <!-- プレビュー -->

  <div class="preview-card">

    <div class="preview-frame">

      <canvas
        id="previewCanvas">
      </canvas>

    </div>

  </div>


  <!-- 状態表示 -->

  <div class="info">

    <div id="status">

      写真を選択してください。

    </div>

  </div>


  <!-- 操作 -->

  <div class="controls">

    <button id="zoomOut">
      − 縮小
    </button>

    <button id="reset">
      リセット
    </button>

    <button id="zoomIn">
      ＋ 拡大
    </button>

  </div>


  <!-- 出力 -->

  <button
    id="pdfButton"
    class="pdf-button"
    disabled>

    📄 実寸A4出力

  </button>


  <div class="help">

    1本指：写真を移動<br>

    2本指：拡大・縮小<br>

    ボタンでも拡大・縮小できます。

    <br><br>

    A4用紙にGrande 470ml用台紙を
    <strong>実寸</strong>で配置します。

    <br>

    印刷時は
    「実際のサイズ / 100%」
    を選択してください。

  </div>


</div>



<script>


/* =========================================================
   クリタンメーカー Grande 470ml
   ========================================================= */


/* =========================================================
   1. 実寸設定
   ========================================================= */


/*
 * A4
 */

const PAPER = {

  width: 210,

  height: 297

};


/*
 * Grande 470ml
 *
 * 現在採用している形状。
 *
 * 上：180mm
 * 下：164mm
 * 高さ：105mm
 *
 * 上下を湾曲させる。
 */

const TEMPLATE = {

  width: 180,

  height: 105,

  topWidth: 180,

  bottomWidth: 164,

  topCurve: 8,

  bottomCurve: 7

};



/* =========================================================
   2. プレビュー設定
   ========================================================= */


/*
 * プレビュー用キャンバス。
 *
 * 実寸とは完全に別。
 */

const PREVIEW_WIDTH = 900;

const PREVIEW_HEIGHT = 600;


/*
 * プレビュー上で
 * 1mmを何pxとして表示するか。
 */

const PREVIEW_PX_PER_MM = 2.7;



/* =========================================================
   3. DOM
   ========================================================= */

const previewCanvas =
  document.getElementById(
    "previewCanvas"
  );

const ctx =
  previewCanvas.getContext(
    "2d"
  );

const fileInput =
  document.getElementById(
    "fileInput"
  );

const status =
  document.getElementById(
    "status"
  );

const pdfButton =
  document.getElementById(
    "pdfButton"
  );



/* =========================================================
   4. Canvas
   ========================================================= */

previewCanvas.width =
  PREVIEW_WIDTH;

previewCanvas.height =
  PREVIEW_HEIGHT;



/* =========================================================
   5. 写真状態
   ========================================================= */

let image = null;


/*
 * ここが重要。
 *
 * scaleは
 * 「画像1pxが何mmになるか」
 * という実寸ベースの値。
 *
 * 画面用pxとは混ぜない。
 */

let imageScaleMm = 1;


/*
 * 写真の移動量。
 *
 * 単位：mm
 */

let offsetXmm = 0;

let offsetYmm = 0;



/* =========================================================
   6. タッチ操作状態
   ========================================================= */

let dragging = false;

let startX = 0;

let startY = 0;

let startOffsetXmm = 0;

let startOffsetYmm = 0;


let pinchStartDistance = 0;

let pinchStartScaleMm = 1;



/* =========================================================
   7. 台紙形状
   ========================================================= */

function getTemplateGeometry() {

  const topWidth =
    TEMPLATE.topWidth;

  const bottomWidth =
    TEMPLATE.bottomWidth;

  const height =
    TEMPLATE.height;

  const topCurve =
    TEMPLATE.topCurve;

  const bottomCurve =
    TEMPLATE.bottomCurve;


  const centerX =
    PAPER.width / 2;


  const xTop =
    centerX -
    topWidth / 2;


  const xBottom =
    centerX -
    bottomWidth / 2;


  const yTop =
    55;


  const yBottom =
    yTop +
    height;


  return {

    centerX,

    xTop,

    xBottom,

    yTop,

    yBottom,

    topWidth,

    bottomWidth,

    height,

    topCurve,

    bottomCurve

  };

}



/* =========================================================
   8. 台紙パス
   ========================================================= */

function drawTemplatePath(
  context,
  t,
  scale
) {

  const xTop =
    t.xTop * scale;

  const xBottom =
    t.xBottom * scale;

  const yTop =
    t.yTop * scale;

  const yBottom =
    t.yBottom * scale;

  const topWidth =
    t.topWidth * scale;

  const bottomWidth =
    t.bottomWidth * scale;

  const centerX =
    t.centerX * scale;

  const topCurve =
    t.topCurve * scale;

  const bottomCurve =
    t.bottomCurve * scale;


  context.beginPath();


  context.moveTo(

    xTop,

    yTop +
    topCurve

  );


  context.quadraticCurveTo(

    centerX,

    yTop -
    topCurve,

    xTop +
    topWidth,

    yTop +
    topCurve

  );


  context.lineTo(

    xBottom +
    bottomWidth,

    yBottom -
    bottomCurve

  );


  context.quadraticCurveTo(

    centerX,

    yBottom +
    bottomCurve,

    xBottom,

    yBottom -
    bottomCurve

  );


  context.closePath();

}



/* =========================================================
   9. 初期倍率
   ========================================================= */

function calculateInitialScale() {

  if (!image) {

    return 1;

  }


  /*
   * 写真が台紙を完全に覆うための倍率。
   *
   * ここから実寸mmとして管理する。
   */

  const scaleX =
    TEMPLATE.width /
    image.width;

  const scaleY =
    TEMPLATE.height /
    image.height;


  return Math.max(
    scaleX,
    scaleY
  );

}



/* =========================================================
   10. 写真読み込み
   ========================================================= */

fileInput.addEventListener(
  "change",
  function(e) {

    const file =
      e.target.files[0];

    if (!file) {

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        const img =
          new Image();


        img.onload =
          function() {

            image = img;


            /*
             * 実寸ベースで初期配置。
             */

            imageScaleMm =
              calculateInitialScale();


            offsetXmm = 0;

            offsetYmm = 0;


            status.innerHTML =

              "✓ 写真を読み込みました。<br>" +

              "Grande 470mlの台紙いっぱいに表示しています。";


            pdfButton.disabled =
              false;


            drawPreview();

          };


        img.src =
          event.target.result;

      };


    reader.readAsDataURL(file);

  }
);



/* =========================================================
   11. プレビュー描画
   ========================================================= */

function drawPreview() {

  /*
   * 背景
   */

  ctx.clearRect(

    0,

    0,

    PREVIEW_WIDTH,

    PREVIEW_HEIGHT

  );


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(

    0,

    0,

    PREVIEW_WIDTH,

    PREVIEW_HEIGHT

  );


  if (!image) {

    return;

  }


  /*
   * 台紙を画面中央へ。
   */

  const templateWidthPx =
    TEMPLATE.width *
    PREVIEW_PX_PER_MM;

  const templateHeightPx =
    TEMPLATE.height *
    PREVIEW_PX_PER_MM;


  const templateX =
    (PREVIEW_WIDTH -
     templateWidthPx) / 2;


  const templateY =
    (PREVIEW_HEIGHT -
     templateHeightPx) / 2;


  const centerX =
    templateX +
    templateWidthPx / 2;


  const centerY =
    templateY +
    templateHeightPx / 2;



  /* ---------------------------------
     台紙クリッピング
     --------------------------------- */

  ctx.save();


  ctx.beginPath();


  const topWidth =
    TEMPLATE.topWidth *
    PREVIEW_PX_PER_MM;

  const bottomWidth =
    TEMPLATE.bottomWidth *
    PREVIEW_PX_PER_MM;

  const height =
    TEMPLATE.height *
    PREVIEW_PX_PER_MM;


  const topCurve =
    TEMPLATE.topCurve *
    PREVIEW_PX_PER_MM;

  const bottomCurve =
    TEMPLATE.bottomCurve *
    PREVIEW_PX_PER_MM;


  const xTop =
    centerX -
    topWidth / 2;


  const xBottom =
    centerX -
    bottomWidth / 2;


  const yTop =
    centerY -
    height / 2;


  const yBottom =
    centerY +
    height / 2;


  ctx.moveTo(

    xTop,

    yTop +
    topCurve

  );


  ctx.quadraticCurveTo(

    centerX,

    yTop -
    topCurve,

    xTop +
    topWidth,

    yTop +
    topCurve

  );


  ctx.lineTo(

    xBottom +
    bottomWidth,

    yBottom -
    bottomCurve

  );


  ctx.quadraticCurveTo(

    centerX,

    yBottom +
    bottomCurve,

    xBottom,

    yBottom -
    bottomCurve

  );


  ctx.closePath();


  ctx.clip();



  /* ---------------------------------
     写真
     --------------------------------- */


  /*
   * 実寸mm
   * ↓
   * プレビューpx
   */

  const imgWmm =
    image.width *
    imageScaleMm;

  const imgHmm =
    image.height *
    imageScaleMm;


  const imgWpx =
    imgWmm *
    PREVIEW_PX_PER_MM;

  const imgHpx =
    imgHmm *
    PREVIEW_PX_PER_MM;


  const offsetXpx =
    offsetXmm *
    PREVIEW_PX_PER_MM;

  const offsetYpx =
    offsetYmm *
    PREVIEW_PX_PER_MM;


  const drawX =
    centerX -
    imgWpx / 2 +
    offsetXpx;


  const drawY =
    centerY -
    imgHpx / 2 +
    offsetYpx;


  ctx.drawImage(

    image,

    drawX,

    drawY,

    imgWpx,

    imgHpx

  );


  ctx.restore();



  /* ---------------------------------
     台紙外周線
     --------------------------------- */

  ctx.save();


  ctx.strokeStyle =
    "#555";

  ctx.lineWidth =
    3;


  ctx.beginPath();


  ctx.moveTo(

    xTop,

    yTop +
    topCurve

  );


  ctx.quadraticCurveTo(

    centerX,

    yTop -
    topCurve,

    xTop +
    topWidth,

    yTop +
    topCurve

  );


  ctx.lineTo(

    xBottom +
    bottomWidth,

    yBottom -
    bottomCurve

  );


  ctx.quadraticCurveTo(

    centerX,

    yBottom +
    bottomCurve,

    xBottom,

    yBottom -
    bottomCurve

  );


  ctx.closePath();


  ctx.stroke();


  ctx.restore();

}



/* =========================================================
   12. ズーム
   ========================================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    function() {

      imageScaleMm *= 1.15;

      drawPreview();

    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    function() {

      imageScaleMm /= 1.15;

      drawPreview();

    }
  );



/* =========================================================
   13. リセット
   ========================================================= */

document
  .getElementById("reset")
  .addEventListener(
    "click",
    function() {

      if (!image) {

        return;

      }


      imageScaleMm =
        calculateInitialScale();


      offsetXmm = 0;

      offsetYmm = 0;


      drawPreview();

    }
  );



/* =========================================================
   14. タッチ開始
   ========================================================= */

previewCanvas.addEventListener(

  "touchstart",

  function(e) {

    e.preventDefault();


    if (!image) {

      return;

    }


    if (
      e.touches.length === 1
    ) {

      dragging = true;


      startX =
        e.touches[0].clientX;


      startY =
        e.touches[0].clientY;


      startOffsetXmm =
        offsetXmm;


      startOffsetYmm =
        offsetYmm;

    }


    else if (
      e.touches.length === 2
    ) {

      dragging = false;


      pinchStartDistance =
        getTouchDistance(
          e.touches
        );


      pinchStartScaleMm =
        imageScaleMm;

    }

  },

  {
    passive: false
  }

);



/* =========================================================
   15. タッチ移動
   ========================================================= */

previewCanvas.addEventListener(

  "touchmove",

  function(e) {

    e.preventDefault();


    if (!image) {

      return;

    }


    /* ---------------------------------
       1本指
       --------------------------------- */

    if (
      e.touches.length === 1 &&
      dragging
    ) {


      const dxPx =
        e.touches[0].clientX -
        startX;


      const dyPx =
        e.touches[0].clientY -
        startY;


      /*
       * 画面px
       * ↓
       * 実寸mm
       *
       * 同じ方向に移動する。
       */

      const dxMm =
        dxPx /
        PREVIEW_PX_PER_MM;


      const dyMm =
        dyPx /
        PREVIEW_PX_PER_MM;


      offsetXmm =
        startOffsetXmm +
        dxMm;


      offsetYmm =
        startOffsetYmm +
        dyMm;


      drawPreview();

    }


    /* ---------------------------------
       2本指
       --------------------------------- */

    else if (
      e.touches.length === 2
    ) {


      const distance =
        getTouchDistance(
          e.touches
        );


      if (
        pinchStartDistance > 0
      ) {


        const ratio =
          distance /
          pinchStartDistance;


        imageScaleMm =
          pinchStartScaleMm *
          ratio;


        drawPreview();

      }

    }

  },

  {
    passive: false
  }

);



/* =========================================================
   16. タッチ終了
   ========================================================= */

previewCanvas.addEventListener(

  "touchend",

  function(e) {

    if (
      e.touches.length === 0
    ) {

      dragging = false;

      pinchStartDistance = 0;

    }

  }

);



/* =========================================================
   17. 2本指距離
   ========================================================= */

function getTouchDistance(
  touches
) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;


  const dy =
    touches[0].clientY -
    touches[1].clientY;


  return Math.sqrt(

    dx * dx +
    dy * dy

  );

}



/* =========================================================
   18. A4出力ボタン
   ========================================================= */

pdfButton.addEventListener(

  "click",

  function() {

    if (!image) {

      alert(
        "先に写真を選択してください。"
      );

      return;

    }


    createPrintPage();

  }

);



/* =========================================================
   19. A4印刷ページ
   ========================================================= */

function createPrintPage() {


  /*
   * Grande台紙の位置
   */

  const t =
    getTemplateGeometry();


  const topWidth =
    t.topWidth;


  const bottomWidth =
    t.bottomWidth;


  const height =
    t.height;


  const topCurve =
    t.topCurve;


  const bottomCurve =
    t.bottomCurve;


  const centerX =
    t.centerX;


  const xTop =
    t.xTop;


  const xBottom =
    t.xBottom;


  const yTop =
    t.yTop;


  const yBottom =
    t.yBottom;



  /* ---------------------------------
     SVG path
     --------------------------------- */

  const path = `

    M ${xTop}
      ${yTop + topCurve}

    Q ${centerX}
      ${yTop - topCurve}

      ${xTop + topWidth}
      ${yTop + topCurve}

    L ${xBottom + bottomWidth}
      ${yBottom - bottomCurve}

    Q ${centerX}
      ${yBottom + bottomCurve}

      ${xBottom}
      ${yBottom - bottomCurve}

    Z

  `;



  /* ---------------------------------
     写真データ
     --------------------------------- */

  const imageData =
    imageToDataURL(image);



  /*
   * 写真サイズは
   * 実寸mmで直接計算。
   *
   * ここが今回の最重要部分。
   */

  const imgW =
    image.width *
    imageScaleMm;


  const imgH =
    image.height *
    imageScaleMm;


  /*
   * 写真位置
   */

  const imgX =
    centerX -
    imgW / 2 +
    offsetXmm;


  const imgY =
    (yTop +
     height / 2) -
    imgH / 2 +
    offsetYmm;



  /* ---------------------------------
     印刷用HTML
     --------------------------------- */

  const printHTML = `

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">


<title>
Grande 470ml 台紙
</title>


<style>

@page {

  size: A4 portrait;

  margin: 0;

}


html,
body {

  margin: 0;

  padding: 0;

  width: 210mm;

  height: 297mm;

  background: white;

}


.page {

  position: relative;

  width: 210mm;

  height: 297mm;

  overflow: hidden;

}


svg {

  display: block;

  width: 210mm;

  height: 297mm;

}


.instructions {

  position: absolute;

  top: 8mm;

  left: 10mm;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Helvetica Neue",

    sans-serif;

  font-size: 4mm;

  line-height: 1.5;

  color: #222;

}


.print-button {

  position: fixed;

  top: 8mm;

  right: 10mm;

  z-index: 100;

  padding: 10px 18px;

  border: none;

  border-radius: 10px;

  background: #222;

  color: white;

  font-size: 16px;

}


@media print {

  .print-button {

    display: none;

  }

}

</style>

</head>


<body>


<div class="page">


<div class="instructions">

<strong>
Grande 470ml 台紙
</strong>

<br>

A4実寸

<br>

印刷時：
「実際のサイズ / 100%」

</div>


<button
  class="print-button"
  onclick="window.print()">

🖨 印刷 / PDF保存

</button>



<svg

  xmlns="http://www.w3.org/2000/svg"

  width="210mm"

  height="297mm"

  viewBox="0 0 210 297">


<defs>


<clipPath
  id="templateClip">


<path
  d="${path}"
/>


</clipPath>


</defs>



<!-- =========================
     写真
     ========================= -->


<image

  href="${imageData}"

  x="${imgX}"

  y="${imgY}"

  width="${imgW}"

  height="${imgH}"

  preserveAspectRatio="none"

  clip-path="url(#templateClip)"

/>



<!-- =========================
     台紙外周
     ========================= -->


<path

  d="${path}"

  fill="none"

  stroke="#444"

  stroke-width="0.4"

/>



<!-- =========================
     100mm確認スケール
     ========================= -->


<line

  x1="20"

  y1="270"

  x2="120"

  y2="270"

  stroke="#444"

  stroke-width="0.4"

/>


<line

  x1="20"

  y1="268"

  x2="20"

  y2="272"

  stroke="#444"

  stroke-width="0.4"

/>


<line

  x1="120"

  y1="268"

  x2="120"

  y2="272"

  stroke="#444"

  stroke-width="0.4"

/>


<text

  x="20"

  y="266"

  font-size="3"

  fill="#444">

100 mm

</text>


<text

  x="20"

  y="276"

  font-size="2.5"

  fill="#444">

Grande 470ml / 実寸

</text>


</svg>


</div>


</body>

</html>

`;



  /* ---------------------------------
     新しいページを開く
     --------------------------------- */

  const newWindow =
    window.open(
      "",
      "_blank"
    );


  if (!newWindow) {

    alert(

      "ポップアップがブロックされています。Safariの設定を確認してください。"

    );

    return;

  }


  newWindow.document.open();


  newWindow.document.write(
    printHTML
  );


  newWindow.document.close();

}



/* =========================================================
   20. Image → DataURL
   ========================================================= */

function imageToDataURL(img) {


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    img.naturalWidth ||
    img.width;


  canvas.height =
    img.naturalHeight ||
    img.height;


  const c =
    canvas.getContext(
      "2d"
    );


  c.drawImage(

    img,

    0,

    0

  );


  return canvas.toDataURL(

    "image/jpeg",

    0.95

  );

}
