<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>クリタンメーカー Grande STEP 2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f4f4;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

.wrap {
  max-width: 760px;
  margin: auto;
  padding: 18px;
}

h1 {
  font-size: 23px;
  margin: 0 0 4px;
}

.note {
  font-size: 14px;
  color: #666;
  line-height: 1.5;
  margin: 0 0 15px;
}

.btn {
  display: block;
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #222;
  color: #fff;
  text-align: center;
  font-weight: 700;
  font-size: 16px;
}

input {
  display: none;
}

.stage {
  margin-top: 14px;
  padding: 10px;
  background: #ddd;
  border-radius: 14px;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #fff;
  border-radius: 8px;
  touch-action: none;
}

.status {
  margin-top: 12px;
  padding: 11px;
  background: #fff;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.45;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.controls button {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font-size: 15px;
}

.small {
  font-size: 12px;
  color: #777;
  margin-top: 8px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="wrap">

<h1>クリタンメーカー — Grande 470ml</h1>

<p class="note">
STEP 2：Grande 470mlの実データを使った湾曲プレビュー
</p>

<label class="btn">
📷 写真を選ぶ
<input id="file" type="file" accept="image/*">
</label>

<div class="stage">
<canvas id="canvas" width="1200" height="820"></canvas>
</div>

<div id="status" class="status">
写真を選択してください。
</div>

<div class="controls">

<button id="minus">
− 縮小
</button>

<button id="reset">
リセット
</button>

<button id="plus">
＋ 拡大
</button>

</div>

<p class="small">
1本指：写真の位置調整 ／ 2本指：拡大・縮小<br>
※今回は画面上の湾曲プレビュー検証です。PDF出力は次段階です。
</p>

</div>


<script>

/*
==================================================
Grande 470ml 台紙形状
==================================================

ct_dat.zip の Grande データを基準

内側半径
693.518822 mm

外側半径
863.140017 mm

中心角
16.336130°
==================================================
*/

const RIN = 693.51882249879;

const ROUT = 863.14001699879;

const TH =
  Math.PI / 180 * 16.336130;


/*
==================================================
基本設定
==================================================
*/

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const file =
  document.getElementById("file");

const status =
  document.getElementById("status");


let img = null;

let zoom = 1;

let panX = 0;

let panY = 0;

let drag = false;

let lastX = 0;

let lastY = 0;

let pinchStart = 0;

let pinchZoom = 1;


/*
==================================================
2点間の距離
==================================================
*/

function distance(a, b) {

  return Math.hypot(
    a.clientX - b.clientX,
    a.clientY - b.clientY
  );

}


/*
==================================================
台紙の外接矩形
==================================================
*/

function bounds() {

  return {

    xmin:
      RIN * Math.cos(TH / 2),

    xmax:
      ROUT,

    ymin:
      -ROUT * Math.sin(TH / 2),

    ymax:
      ROUT * Math.sin(TH / 2)

  };

}


/*
==================================================
描画
==================================================
*/

function render() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.fillStyle = "#fff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (!img) {
    return;
  }


  const b = bounds();


  const outputWidth =
    b.xmax - b.xmin;

  const outputHeight =
    b.ymax - b.ymin;


  const w =
    canvas.width;

  const h =
    canvas.height;


  /*
  -----------------------------------------------
  元写真を一時キャンバスへ
  -----------------------------------------------
  */

  const temp =
    document.createElement("canvas");

  temp.width =
    img.naturalWidth;

  temp.height =
    img.naturalHeight;


  const tempCtx =
    temp.getContext("2d");


  tempCtx.drawImage(
    img,
    0,
    0
  );


  const source =
    tempCtx.getImageData(
      0,
      0,
      temp.width,
      temp.height
    ).data;


  /*
  -----------------------------------------------
  出力画像
  -----------------------------------------------
  */

  const output =
    ctx.createImageData(
      w,
      h
    );

  const pixels =
    output.data;


  /*
  -----------------------------------------------
  台紙の各ピクセルについて
  円弧座標へ逆変換
  -----------------------------------------------
  */

  for (
    let py = 0;
    py < h;
    py++
  ) {

    const y =
      b.ymin +
      (py + 0.5) /
      h *
      outputHeight;


    for (
      let px = 0;
      px < w;
      px++
    ) {

      const x =
        b.xmin +
        (px + 0.5) /
        w *
        outputWidth;


      /*
      円筒座標から
      半径・角度を求める
      */

      const radius =
        Math.hypot(
          x,
          y
        );


      const angle =
        Math.atan2(
          y,
          x
        );


      /*
      台紙外なら透明
      */

      if (
        radius < RIN ||
        radius > ROUT ||
        angle < -TH / 2 ||
        angle > TH / 2
      ) {

        continue;

      }


      /*
      -------------------------------------------
      台紙座標を0～1へ正規化
      -------------------------------------------
      */

      let u =
        (angle + TH / 2) /
        TH;


      let v =
        (radius - RIN) /
        (ROUT - RIN);


      /*
      -------------------------------------------
      ユーザー操作を反映
      -------------------------------------------
      */

      u =
        (u - 0.5) /
        zoom +
        0.5 +
        panX;


      v =
        (v - 0.5) /
        zoom +
        0.5 +
        panY;


      /*
      写真範囲外
      */

      if (
        u < 0 ||
        u > 1 ||
        v < 0 ||
        v > 1
      ) {

        continue;

      }


      /*
      -------------------------------------------
      元写真のピクセルを取得
      -------------------------------------------
      */

      const sourceX =
        Math.min(
          temp.width - 1,
          Math.max(
            0,
            Math.floor(
              u * temp.width
            )
          )
        );


      const sourceY =
        Math.min(
          temp.height - 1,
          Math.max(
            0,
            Math.floor(
              v * temp.height
            )
          )
        );


      const sourceIndex =
        (
          sourceY *
          temp.width +
          sourceX
        ) * 4;


      const destinationIndex =
        (
          py *
          w +
          px
        ) * 4;


      pixels[destinationIndex] =
        source[sourceIndex];

      pixels[destinationIndex + 1] =
        source[sourceIndex + 1];

      pixels[destinationIndex + 2] =
        source[sourceIndex + 2];

      pixels[destinationIndex + 3] =
        255;

    }

  }


  /*
  -----------------------------------------------
  キャンバスへ描画
  -----------------------------------------------
  */

  ctx.putImageData(
    output,
    0,
    0
  );


  /*
  -----------------------------------------------
  台紙の輪郭線
  -----------------------------------------------
  */

  ctx.save();

  ctx.strokeStyle =
    "#222";

  ctx.lineWidth =
    3;


  ctx.beginPath();


  /*
  外側円弧
  */

  for (
    let i = 0;
    i <= 160;
    i++
  ) {

    const angle =
      -TH / 2 +
      TH * i / 160;


    const x =
      (
        ROUT *
        Math.cos(angle) -
        b.xmin
      ) /
      outputWidth *
      w;


    const y =
      (
        ROUT *
        Math.sin(angle) -
        b.ymin
      ) /
      outputHeight *
      h;


    if (i === 0) {

      ctx.moveTo(
        x,
        y
      );

    } else {

      ctx.lineTo(
        x,
        y
      );

    }

  }


  /*
  内側円弧
  */

  for (
    let i = 160;
    i >= 0;
    i--
  ) {

    const angle =
      -TH / 2 +
      TH * i / 160;


    const x =
      (
        RIN *
        Math.cos(angle) -
        b.xmin
      ) /
      outputWidth *
      w;


    const y =
      (
        RIN *
        Math.sin(angle) -
        b.ymin
      ) /
      outputHeight *
      h;


    ctx.lineTo(
      x,
      y
    );

  }


  ctx.closePath();

  ctx.stroke();

  ctx.restore();

}


/*
==================================================
写真選択
==================================================
*/

file.addEventListener(
  "change",
  function () {

    const selected =
      file.files &&
      file.files[0];


    if (!selected) {

      return;

    }


    const url =
      URL.createObjectURL(
        selected
      );


    img =
      new Image();


    img.onload =
      function () {

        zoom = 1;

        panX = 0;

        panY = 0;


        status.innerHTML =
          "✓ 写真を読み込みました。<br>" +
          "Grande 470mlの実寸形状に沿って湾曲表示しています。";


        render();


        URL.revokeObjectURL(
          url
        );

      };


    img.onerror =
      function () {

        status.textContent =
          "✕ 写真を読み込めませんでした。";

      };


    img.src =
      url;

  }
);


/*
==================================================
1本指：写真移動
==================================================
*/

canvas.addEventListener(
  "touchstart",
  function (e) {

    if (
      e.touches.length === 1
    ) {

      drag = true;

      lastX =
        e.touches[0].clientX;

      lastY =
        e.touches[0].clientY;

    }


    else if (
      e.touches.length === 2
    ) {

      drag = false;

      pinchStart =
        distance(
          e.touches[0],
          e.touches[1]
        );

      pinchZoom =
        zoom;

    }

  },
  {
    passive: false
  }
);


/*
==================================================
指を動かす
==================================================
*/

canvas.addEventListener(
  "touchmove",
  function (e) {

    e.preventDefault();


    /*
    1本指
    */

    if (
      e.touches.length === 1 &&
      drag
    ) {

      const dx =
        e.touches[0].clientX -
        lastX;


      const dy =
        e.touches[0].clientY -
        lastY;


      lastX =
        e.touches[0].clientX;

      lastY =
        e.touches[0].clientY;


      panX +=
        dx /
        canvas.clientWidth;


      panY +=
        dy /
        canvas.clientHeight;


      render();

    }


    /*
    2本指
    */

    else if (
      e.touches.length === 2
    ) {

      const currentDistance =
        distance(
          e.touches[0],
          e.touches[1]
        );


      zoom =
        Math.max(
          0.25,
          Math.min(
            5,
            pinchZoom *
            currentDistance /
            pinchStart
          )
        );


      render();

    }

  },
  {
    passive: false
  }
);


canvas.addEventListener(
  "touchend",
  function () {

    drag = false;

  }
);


/*
==================================================
拡大
==================================================
*/

document
  .getElementById("plus")
  .onclick =
  function () {

    zoom =
      Math.min(
        5,
        zoom * 1.15
      );

    render();

  };


/*
==================================================
縮小
==================================================
*/

document
  .getElementById("minus")
  .onclick =
  function () {

    zoom =
      Math.max(
        0.25,
        zoom / 1.15
      );

    render();

  };


/*
==================================================
リセット
==================================================
*/

document
  .getElementById("reset")
  .onclick =
  function () {

    zoom = 1;

    panX = 0;

    panY = 0;

    render();

  };


render();

</script>

</body>
</html>
